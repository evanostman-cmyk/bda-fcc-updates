name: Refresh and publish FCC database
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tower_distance.js'
      - 'elevation_profile.js'
      - 'link_budget.js'
      - 'site_plan.js'
      - 'uplink_gain.js'
      - 'kmz_import.js'
      - 'coverage_survey.js'
      - 'workspace_pages.js'
      - 'smart_site_plan.js'
      - 'rf_path.js'
      - 'component_library.js'
      - 'component_ui.js'
      - 'active_equipment.js'
      - 'scripts/**'
      - '.github/workflows/publish_fcc.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fcc-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit JavaScript, RF calculations, survey logic, and KMZ import
        run: |
          node scripts/audit_suite.cjs
          python -m py_compile scripts/fcc_builder.py scripts/build_hosted.py
      - name: Build FCC P25 frequency data and site pins from official ULS snapshots
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp tower_distance.js site/tower_distance.js
          cp elevation_profile.js site/elevation_profile.js
          cp link_budget.js site/link_budget.js
          cp site_plan.js site/site_plan.js
          cp uplink_gain.js site/uplink_gain.js
          cp kmz_import.js site/kmz_import.js
          cp coverage_survey.js site/coverage_survey.js
          cp workspace_pages.js site/workspace_pages.js
          cp smart_site_plan.js site/smart_site_plan.js
          cp rf_path.js site/rf_path.js
          cp component_library.js site/component_library.js
          cp component_ui.js site/component_ui.js
          node --check component_library.js
          node --check component_ui.js
          cp active_equipment.js site/active_equipment.js
          node --check active_equipment.js
          python scripts/build_hosted.py --output site --download
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub artifact indexing can lag artifact upload by several seconds.
      - name: Allow uploaded Pages artifact to be indexed
        run: sleep 20
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
